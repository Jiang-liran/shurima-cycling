<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f2e9">
  <title>鹈鹕、雷克顿和内瑟斯 · 一起骑行</title>
  <style>
    :root{color-scheme:light;--ink:#253f42;--muted:#6b7974;--paper:#f5f2e9;--coral:#d86b4c;--line:#dcded2}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    button,input{font:inherit}
    button{cursor:pointer;-webkit-tap-highlight-color:transparent}
    button:focus-visible,input:focus-visible{outline:3px solid #b66b39;outline-offset:5px}
    .page{max-width:1360px;margin:0 auto;padding:30px 40px 22px}
    .masthead{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 0 25px}
    .brand{display:flex;align-items:center;gap:12px}
    .brand-icon{width:36px;height:36px}
    .brand-name{font-weight:650;font-size:19px;letter-spacing:3px}
    .brand-sub{margin-top:4px;font-size:9px;letter-spacing:2.2px}
    .masthead-note{font-size:12px;letter-spacing:2px;color:var(--muted)}
    .scene{position:relative;overflow:hidden;isolation:isolate;background:#dfebe4;border-radius:14px;aspect-ratio:1280/720}
    .art{display:block;width:100%;height:100%}
    .scene-heading{position:absolute;z-index:1;top:48px;left:48px;pointer-events:none}
    .eyebrow{font-size:11px;font-weight:550;letter-spacing:3px;display:flex;align-items:center;gap:10px}
    .eyebrow:before{content:"";display:block;width:23px;height:1px;background:var(--ink)}
    h1{font-weight:500;font-size:clamp(30px,3.8vw,50px);line-height:1.43;letter-spacing:5px;margin:18px 0 13px}
    .subtitle{font-size:12px;letter-spacing:2px;color:#557472;margin:0}
    .scene-stamp{position:absolute;right:28px;top:27px;display:flex;gap:8px;align-items:center;color:#506e65;font-size:10px;letter-spacing:1.6px}
    .scene-stamp span{width:6px;height:6px;background:#6d9178;border-radius:50%}
    .scene-caption{position:absolute;bottom:21px;left:30px;font-size:10px;letter-spacing:2px;color:#6f7663}
    .scene-number{position:absolute;right:30px;bottom:19px;font-family:Georgia,serif;font-style:italic;font-size:18px;color:#6c7864}
    .controls{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:22px 0;border-bottom:1px solid var(--line)}
    .play-controls{display:flex;align-items:center;gap:13px}
    .play{background:var(--ink);color:#fbfaf2;border:0;border-radius:50%;width:46px;height:46px;display:grid;place-items:center;transition:background .2s,transform .2s;flex-shrink:0}
    .play:hover{background:#3c6263;transform:translateY(-1px)}
    .play svg{width:16px;height:16px}
    .control-title{font-size:13px;font-weight:550;letter-spacing:1px}
    .control-note{margin-top:5px;font-size:10px;letter-spacing:1px;color:var(--muted)}
    .speed-controls{display:flex;align-items:center;gap:17px}
    .speed-label{font-size:12px;letter-spacing:1px}
    input[type=range]{appearance:none;-webkit-appearance:none;width:145px;height:3px;background:#d3dbce;border-radius:2px;cursor:pointer;accent-color:var(--ink)}
    input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--ink);border:3px solid var(--paper);box-shadow:0 0 0 1px var(--ink)}
    input[type=range]::-moz-range-thumb{width:8px;height:8px;border-radius:50%;background:var(--ink);border:3px solid var(--paper);box-shadow:0 0 0 1px var(--ink)}
    .speed-value{font-size:12px;font-variant-numeric:tabular-nums;min-width:35px}
    .footer{display:flex;justify-content:space-between;gap:20px;padding-top:17px;font-size:10px;letter-spacing:1.2px;color:var(--muted)}
    .footer .english{font-family:Georgia,serif;font-style:italic;font-size:12px;letter-spacing:.5px}
    .stroke{stroke:#29494a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke-width:2.5}
    @media(min-width:1500px){.page{padding-top:44px}}
    @media(max-width:800px){.page{padding:22px 22px 20px}.scene-heading{top:30px;left:30px}.scene-stamp{top:22px;right:20px;font-size:9px}.subtitle{font-size:10px;letter-spacing:1px}h1{margin-top:12px;letter-spacing:3px}.controls{gap:15px}.masthead-note{font-size:10px;letter-spacing:1px}}
    @media(max-width:600px){.page{padding:20px 16px}.masthead{padding-bottom:20px}.brand-name{font-size:17px}.brand-sub{font-size:8px}.masthead-note{display:none}.scene{aspect-ratio:auto;height:560px;border-radius:10px}.scene-heading{top:26px;left:25px}h1{font-size:34px;line-height:1.35;margin:14px 0 12px}.eyebrow{font-size:10px}.subtitle{font-size:11px}.art{position:absolute;bottom:0;height:410px;width:100%}.scene-stamp{font-size:8px;letter-spacing:1px;top:29px;right:17px}.scene-caption{left:20px;bottom:17px;font-size:8px;letter-spacing:1px}.scene-number{right:20px;bottom:15px;font-size:16px}.controls{flex-wrap:wrap;padding:20px 2px;row-gap:23px}.speed-controls{gap:12px}.speed-label{font-size:11px}input[type=range]{width:92px}.speed-value{font-size:11px;min-width:30px}.control-title{font-size:12px}.control-note{font-size:9px}.play{width:42px;height:42px}.play-controls{gap:10px}.footer{font-size:9px;letter-spacing:.5px}.footer .english{font-size:11px}}
    @media(max-width:370px){.controls{align-items:flex-start}.speed-controls{width:100%;justify-content:space-between}input[type=range]{flex:1;max-width:165px}.scene{height:525px}.art{height:380px}.scene-stamp{display:none}}

    .mobile-detail{display:none}
    @media(max-width:600px){.mobile-detail{display:block}.scene{height:780px}.art{height:680px}.scene-stamp{letter-spacing:.7px}.footer{flex-wrap:wrap;row-gap:8px}}
    @media(max-width:370px){.scene{height:700px}.art{height:580px}}
  </style>
</head>

      <div class="scene-caption">与你同行，风景更好。</div><div class="scene-number">05 / ∞</div>
    </section>

    <section class="controls" aria-label="动画控制">
      <div class="play-controls">
        <button type="button" class="play" id="play-toggle" aria-label="暂停动画" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><g id="pause-icon" fill="currentColor"><rect x="3" y="2" width="3" height="12" rx="1"/><rect x="10" y="2" width="3" height="12" rx="1"/></g><path id="play-icon" d="m4 1 10 7-10 7Z" fill="currentColor" style="display:none"/></svg></button>
        <div><div class="control-title" id="play-status" role="status" aria-live="polite">一起兜风</div><div class="control-note">和好朋友一起，慢慢向前</div></div>
      </div>
      <div class="speed-controls"><label class="speed-label" for="speed">骑行速度</label><input id="speed" type="range" min="0.5" max="2" step="0.25" value="1" aria-valuetext="1 倍速度"><output class="speed-value" id="speed-value" for="speed">1.00×</output></div>
    </section>
    <footer class="footer"><span>三个好朋友 · 三辆单车 · 一路好风景</span><span class="english">Good friends. Great rides.</span></footer>
  </main>
  <script>
    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const mobile = matchMedia('(max-width:600px)');
      const button = byId('play-toggle');
      let playing = !reducedMotion.matches;
      let speed=1, elapsed=.28, previous=null, frameId=null;
      const tau=Math.PI*2;
      const roadSpeed=178.68;
      const set=(el,key,value)=>el.setAttribute(key,value);
      const translate=(el,x,y=0)=>set(el,'transform',`translate(${x.toFixed(2)} ${y.toFixed(2)})`);
      const world=Object.fromEntries(['scene','road-texture','mobile-road-texture','mobile-road-texture-bottom','sea-texture','cloud-1','cloud-2','cloud-3','sailboat','wind-lines','bird-a','bird-b','foreground-grasses','back-grasses'].map(id=>[id,byId(id)]));
      const makeRider=(prefix,body,phase)=>({
        prefix, phase, scale:.9, body:byId(prefix+body), placement:byId(prefix+'placement'),
        parts:Object.fromEntries(['rear-spokes','front-spokes','far-crank-arm','near-crank-arm','far-leg','near-leg','near-leg-highlight','near-leg-skin','far-foot','near-foot','scarf-tail','scarf-line','eye-open','eye-closed','bike-shadow','croc-tail','cloth'].map(id=>[id,byId(prefix+id)]))
      });
      const crocodile=makeRider('croc-','crocodile',1.2);
      const pelican=makeRider('pel-','pelican',0);
      const dog=makeRider('dog-','dog',2.6);

      // Each pair of feet remains attached to opposite ends of its own crank.
      function legPath(hip,ankle,upperLength,lowerLength){
        const dx=ankle.x-hip.x,dy=ankle.y-hip.y,d=Math.max(.001,Math.hypot(dx,dy));
        const along=(upperLength*upperLength-lowerLength*lowerLength+d*d)/(2*d);
        const outward=Math.sqrt(Math.max(0,upperLength*upperLength-along*along));
        const knee={x:hip.x+dx*along/d+dy*outward/d,y:hip.y+dy*along/d-dx*outward/d};
        return `M${hip.x.toFixed(2)} ${hip.y.toFixed(2)}L${knee.x.toFixed(2)} ${knee.y.toFixed(2)}L${ankle.x.toFixed(2)} ${ankle.y.toFixed(2)}`;
      }

      function animateRider(r,t){
        const p=r.parts;
        const wheelAngle=t*roadSpeed/(91*r.scale)*180/Math.PI;
        const angle=wheelAngle*Math.PI/180*1.745+r.phase;
        const bob=Math.sin(angle*2)*2.3;
        set(p['rear-spokes'],'transform',`rotate(${wheelAngle%360})`);
        set(p['front-spokes'],'transform',`rotate(${wheelAngle%360})`);
        translate(r.body,0,bob);
        if(p['croc-tail'])set(p['croc-tail'],'transform',`rotate(${Math.sin(t*2.8)*3.2} 511 371)`);
        const near={x:580+Math.cos(angle)*34,y:540+Math.sin(angle)*34};
        const far={x:580-Math.cos(angle)*34,y:540-Math.sin(angle)*34};
        set(p['near-crank-arm'],'d',`M580 540L${near.x} ${near.y}`);
        set(p['far-crank-arm'],'d',`M580 540L${far.x} ${far.y}`);
        const nearPath=legPath({x:550,y:398+bob},{x:near.x,y:near.y-7},95,99);
        for(const id of ['near-leg','near-leg-highlight','near-leg-skin'])if(p[id])set(p[id],'d',nearPath);
        set(p['far-leg'],'d',legPath({x:532,y:400+bob},{x:far.x,y:far.y-7},95,99));
        translate(p['near-foot'],near.x,near.y);translate(p['far-foot'],far.x,far.y);
        const flutter=Math.sin(t*6+r.phase)*7,flutter2=Math.sin(t*6+r.phase-1)*5;
        if(p.cloth)set(p.cloth,'d',`M532 359Q487 ${347+flutter} 462 ${367+flutter2}T413 ${375+flutter2}L424 ${397+flutter2}Q474 ${412+flutter} 527 384Z`);
        if(p['scarf-tail'])set(p['scarf-tail'],'d',`M578 299C540 ${294+flutter2} 531 ${268+flutter} 497 ${282+flutter}S441 ${287-flutter2} 422 ${271-flutter2}L427 ${294-flutter2} 411 ${304-flutter2}Q461 ${324-flutter2} 497 ${305+flutter}T575 320Z`);
        if(p['scarf-line'])set(p['scarf-line'],'d',`M567 306Q530 ${282+flutter} 499 ${294+flutter}T433 ${293-flutter2}`);
        const blink=(t+r.phase)%5.8>5.54;
        set(p['eye-open'],'visibility',blink?'hidden':'visible');
        set(p['eye-closed'],'visibility',blink?'visible':'hidden');
        set(p['bike-shadow'],'rx',255+Math.sin(angle*2)*3);
      }

      function draw(t){
        animateRider(crocodile,t);animateRider(dog,t);animateRider(pelican,t);
        translate(world['road-texture'],-(t*roadSpeed)%300);
        translate(world['mobile-road-texture'],-(t*roadSpeed)%300);
        translate(world['mobile-road-texture-bottom'],-(t*roadSpeed)%300);
        translate(world['sea-texture'],-(t*11)%310);
        translate(world['cloud-1'],110-((t*6+110)%1550));
        translate(world['cloud-2'],220-((t*8+220)%1600));
        translate(world['cloud-3'],50-((t*4+50)%1450));
        set(world.sailboat,'transform',`translate(${1093-Math.sin(t*.04)*95} ${471+Math.sin(t*1.3)*2})`);
        set(world['wind-lines'],'opacity',.5+Math.sin(t*3)*.25);
        translate(world['wind-lines'],Math.sin(t*3)*5);
        const flap=Math.sin(t*2.8)*4;
        set(world['bird-a'],'d',`M838 ${164+flap}q10 ${-7-flap} 20 3 10 ${-10-flap} 20 -3`);
        set(world['bird-b'],'d',`M885 ${188-flap*.6}q7 ${-5+flap*.6} 14 2 7 ${-7+flap*.6} 14 -2`);
        translate(world['foreground-grasses'],-(t*roadSpeed)%1500);
        translate(world['back-grasses'],-(t*45)%1450);
      }
      function tick(now){
        frameId=null;
        if(!playing||document.hidden){previous=null;return;}
        if(previous!==null)elapsed+=Math.min((now-previous)/1000,.06)*speed;
        previous=now;draw(elapsed);frameId=requestAnimationFrame(tick);
      }
      function syncPlayback(){
        button.setAttribute('aria-label',playing?'暂停动画':'播放动画');
        button.setAttribute('aria-pressed',String(!playing));
        byId('pause-icon').style.display=playing?'':'none';
        byId('play-icon').style.display=playing?'none':'';
        byId('play-status').textContent=playing?'一起兜风':'一起停下来，看看海';
        if(frameId!==null)cancelAnimationFrame(frameId);
        frameId=null;previous=null;
        if(playing&&!document.hidden)frameId=requestAnimationFrame(tick);
      }
      function fit(){
        const narrow=mobile.matches;
        set(world.scene,'viewBox',narrow?'160 90 830 1450':'0 0 1280 720');
        for(const rider of [crocodile,dog,pelican])rider.scale=narrow?.8:.65;
        set(crocodile.placement,'transform',narrow?'translate(-25 115) scale(.8)':'translate(-125 212) scale(.65)');
        set(dog.placement,'transform',narrow?'translate(240 560) scale(.8)':'translate(240 225) scale(.65)');
        set(pelican.placement,'transform',narrow?'translate(-25 950) scale(.8)':'translate(605 238) scale(.65)');
        draw(elapsed);
      }
      button.addEventListener('click',()=>{playing=!playing;syncPlayback();});
      byId('speed').addEventListener('input',event=>{
        speed=Number(event.target.value);
        byId('speed-value').textContent=speed.toFixed(2)+'×';
        event.target.setAttribute('aria-valuetext',speed+' 倍速度');
      });
      document.addEventListener('visibilitychange',syncPlayback);
      reducedMotion.addEventListener('change',event=>{if(event.matches){playing=false;syncPlayback();}});
      mobile.addEventListener('change',fit);
      fit();syncPlayback();
    })();
  </script>
</body>
</html>
